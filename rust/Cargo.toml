[package]
name = "langtest"
version = "0.1.0"
edition = "2024"
description = "Evaluates an RSI trading strategy against the hourly KuCoin market data"
license = "MIT"

[dependencies]
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
